name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Check out code

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
 
      - name: Install dependencies
        run: yarn install --frozen-lockfile
 
      - name: Run build
        run: yarn build
